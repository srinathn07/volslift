<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VolFit — Active Workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#F4F5F6}
a{color:#F4F5F6;text-decoration:none}a:hover{color:#FF5A3C}
input{font-family:'JetBrains Mono',monospace}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#0A0C0E;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <!-- Sticky header -->
  <div style="flex-shrink:0;background:#0E1013;border-bottom:1px solid #1E2227;padding:48px 16px 14px 16px;display:flex;align-items:center;gap:12px">
    <div style="display:flex;flex-direction:column;flex:1;min-width:0;gap:3px">
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:#F4F5F6">Push Day</span>
      <div style="display:flex;align-items:center;gap:7px">
        <span style="width:7px;height:7px;border-radius:50%;background:#35D28A;flex-shrink:0"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;color:#C7CCD1">24:18</span>
        <span style="font-size:12px;color:#6A7178">· 12,340 lb</span>
      </div>
    </div>
    <button type="button" aria-label="Workout settings" style="width:38px;height:38px;border-radius:11px;background:#1C2024;border:1px solid #262B30;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C7CCD1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2"></circle>
        <line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2"></circle>
        <line x1="4" y1="18" x2="20" y2="18"></line><circle cx="7" cy="18" r="2"></circle>
      </svg>
    </button>
    <button type="button" style="height:38px;padding:0 18px;border-radius:11px;background:#FF5A3C;border:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#0A0C0E;flex-shrink:0">Finish</button>
  </div>

  <!-- Scrollable exercise list -->
  <div style="flex:1 1 auto;overflow-y:auto;padding:16px 16px 92px 16px;display:flex;flex-direction:column;gap:14px">

    <!-- Exercise 1 -->
    <div style="background:#15181C;border:1px solid #262B30;border-radius:16px;padding:14px 12px 10px 12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:11px;padding:0 2px">
        <div style="width:38px;height:38px;border-radius:11px;background:#1C2024;border:1px solid #2A2F35;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF5A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6"></path><path d="M2 8v8"></path><path d="M6 10v4"></path><path d="M18 10v4"></path><path d="M22 8v8"></path><path d="M20 9v6"></path><path d="M8 12h8"></path>
          </svg>
        </div>
        <div style="display:flex;flex-direction:column;flex:1;min-width:0;gap:1px">
          <span style="font-size:15px;font-weight:600;color:#F4F5F6">Bench Press</span>
          <span style="font-size:11.5px;color:#8B939B">Barbell · Chest</span>
        </div>
        <button type="button" aria-label="Bench Press options" style="width:30px;height:30px;border-radius:8px;background:none;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#6A7178" stroke="none" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle>
          </svg>
        </button>
      </div>

      <div style="display:grid;grid-template-columns:28px 1fr 64px 52px 34px;gap:6px;align-items:center;padding:0 2px">
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178;text-align:center">SET</span>
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178">PREVIOUS</span>
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178;text-align:center">LB</span>
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178;text-align:center">REPS</span>
        <span></span>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{setsA}}" as="s" hint-placeholder-count="3">
          <div style="{{s.rowStyle}}">
            <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:#C7CCD1;text-align:center">{{s.n}}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#6A7178">{{s.prev}}</span>
            <input type="text" inputmode="decimal" aria-label="{{s.weightLabel}}" defaultValue="{{s.weight}}" style="width:100%;box-sizing:border-box;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;color:#F4F5F6;font-weight:600;font-size:14px;text-align:center;padding:0">
            <input type="text" inputmode="numeric" aria-label="{{s.repsLabel}}" defaultValue="{{s.reps}}" style="width:100%;box-sizing:border-box;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;color:#F4F5F6;font-weight:600;font-size:14px;text-align:center;padding:0">
            <button type="button" aria-label="{{s.checkLabel}}" onClick="{{s.toggle}}" style="{{s.checkStyle}}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{s.checkColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="5 13 9.5 17.5 19 7"></polyline>
              </svg>
            </button>
          </div>
        </sc-for>
      </div>

      <button type="button" style="height:36px;border-radius:10px;background:none;border:1px dashed #2E343A;color:#8B939B;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B939B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Set
      </button>
    </div>

    <!-- Exercise 2 -->
    <div style="background:#15181C;border:1px solid #262B30;border-radius:16px;padding:14px 12px 10px 12px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:11px;padding:0 2px">
        <div style="width:38px;height:38px;border-radius:11px;background:#1C2024;border:1px solid #2A2F35;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#4A90FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6"></path><path d="M2 8v8"></path><path d="M6 10v4"></path><path d="M18 10v4"></path><path d="M22 8v8"></path><path d="M20 9v6"></path><path d="M8 12h8"></path>
          </svg>
        </div>
        <div style="display:flex;flex-direction:column;flex:1;min-width:0;gap:1px">
          <span style="font-size:15px;font-weight:600;color:#F4F5F6">Incline Dumbbell Press</span>
          <span style="font-size:11.5px;color:#8B939B">Dumbbell · Chest</span>
        </div>
        <button type="button" aria-label="Incline Dumbbell Press options" style="width:30px;height:30px;border-radius:8px;background:none;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#6A7178" stroke="none" aria-hidden="true">
            <circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle>
          </svg>
        </button>
      </div>

      <div style="display:grid;grid-template-columns:28px 1fr 64px 52px 34px;gap:6px;align-items:center;padding:0 2px">
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178;text-align:center">SET</span>
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178">PREVIOUS</span>
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178;text-align:center">LB</span>
        <span style="font-size:9.5px;font-weight:600;letter-spacing:0.08em;color:#6A7178;text-align:center">REPS</span>
        <span></span>
      </div>

      <div style="display:grid;grid-template-columns:28px 1fr 64px 52px 34px;gap:6px;align-items:center;padding:0 2px">
        <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:#C7CCD1;text-align:center">1</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#6A7178">65 × 10</span>
        <input type="text" inputmode="decimal" aria-label="Weight, set 1 of Incline Dumbbell Press" defaultValue="65" style="width:100%;box-sizing:border-box;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;color:#F4F5F6;font-weight:600;font-size:14px;text-align:center;padding:0">
        <input type="text" inputmode="numeric" aria-label="Reps, set 1 of Incline Dumbbell Press" defaultValue="10" style="width:100%;box-sizing:border-box;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;color:#F4F5F6;font-weight:600;font-size:14px;text-align:center;padding:0">
        <button type="button" aria-label="Mark set 1 of Incline Dumbbell Press done" style="width:34px;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;display:flex;align-items:center;justify-content:center;padding:0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#565C63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="5 13 9.5 17.5 19 7"></polyline>
          </svg>
        </button>
      </div>

      <div style="display:grid;grid-template-columns:28px 1fr 64px 52px 34px;gap:6px;align-items:center;padding:0 2px">
        <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:#C7CCD1;text-align:center">2</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#6A7178">65 × 9</span>
        <input type="text" inputmode="decimal" aria-label="Weight, set 2 of Incline Dumbbell Press" defaultValue="65" style="width:100%;box-sizing:border-box;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;color:#F4F5F6;font-weight:600;font-size:14px;text-align:center;padding:0">
        <input type="text" inputmode="numeric" aria-label="Reps, set 2 of Incline Dumbbell Press" defaultValue="9" style="width:100%;box-sizing:border-box;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;color:#F4F5F6;font-weight:600;font-size:14px;text-align:center;padding:0">
        <button type="button" aria-label="Mark set 2 of Incline Dumbbell Press done" style="width:34px;height:34px;border-radius:9px;background:#1C2024;border:1px solid #2A2F35;display:flex;align-items:center;justify-content:center;padding:0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#565C63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="5 13 9.5 17.5 19 7"></polyline>
          </svg>
        </button>
      </div>

      <button type="button" style="height:36px;border-radius:10px;background:none;border:1px dashed #2E343A;color:#8B939B;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B939B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Set
      </button>
    </div>

  </div>

  <!-- Add exercise -->
  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px 16px;background:linear-gradient(to top, #0A0C0E 55%, rgba(10,12,14,0))">
    <a href="Library.dc.html" style="display:flex;align-items:center;justify-content:center;gap:9px;height:50px;border-radius:14px;background:#1C2024;border:1px solid #32383E;font-size:15px;font-weight:600;color:#F4F5F6">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF5A3C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Add Exercise
    </a>
  </div>

  <!-- Rest timer sheet -->
  <sc-if value="{{restOpen}}" hint-placeholder-val="{{true}}">
    <div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(5,6,8,0.72);display:flex;flex-direction:column;justify-content:flex-end">
      <div style="background:#15181C;border-top:1px solid #2A2F35;border-radius:24px 24px 0 0;padding:14px 20px 26px 20px;display:flex;flex-direction:column;align-items:center;gap:16px">
        <span style="width:40px;height:4px;border-radius:2px;background:#32383E"></span>
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#F4F5F6">Rest Timer</span>

        <div style="position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center">
          <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true" style="position:absolute;top:0;left:0;transform:rotate(-90deg)">
            <circle cx="64" cy="64" r="56" fill="none" stroke="#242A30" stroke-width="8"></circle>
            <circle cx="64" cy="64" r="56" fill="none" stroke="#FF5A3C" stroke-width="8" stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="70"></circle>
          </svg>
          <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
            <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;color:#F4F5F6">1:12</span>
            <span style="font-size:11px;color:#8B939B">of 1:30</span>
          </div>
        </div>

        <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center">
          <sc-for list="{{restPills}}" as="p" hint-placeholder-count="5">
            <button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
          </sc-for>
        </div>

        <div style="display:flex;gap:10px;width:100%">
          <button type="button" onClick="{{closeRest}}" style="flex:1;height:48px;border-radius:13px;background:#1C2024;border:1px solid #32383E;font-size:14.5px;font-weight:600;color:#C7CCD1">Skip</button>
          <button type="button" onClick="{{closeRest}}" style="flex:1;height:48px;border-radius:13px;background:#FF5A3C;border:none;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:#0A0C0E">Done</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { 1: true, 2: true, 3: false }, restOpen: false, rest: 90 };
  }

  rowStyle(active) {
    var bg = active ? 'rgba(53,210,138,0.07)' : 'transparent';
    return 'display:grid;grid-template-columns:28px 1fr 64px 52px 34px;gap:6px;align-items:center;padding:3px 2px;border-radius:10px;background:' + bg;
  }

  checkStyle(active) {
    var bg = active ? '#35D28A' : '#1C2024';
    var bd = active ? '#35D28A' : '#2A2F35';
    return 'width:34px;height:34px;border-radius:9px;background:' + bg + ';border:1px solid ' + bd + ';display:flex;align-items:center;justify-content:center;padding:0';
  }

  renderVals() {
    var self = this;
    var raw = [
      { n: 1, prev: '185 × 8', weight: '185', reps: '8' },
      { n: 2, prev: '185 × 8', weight: '185', reps: '8' },
      { n: 3, prev: '185 × 7', weight: '190', reps: '6' }
    ];
    var setsA = raw.map(function (s) {
      var active = !!self.state.done[s.n];
      return {
        n: s.n,
        prev: s.prev,
        weight: s.weight,
        reps: s.reps,
        weightLabel: 'Weight, set ' + s.n + ' of Bench Press',
        repsLabel: 'Reps, set ' + s.n + ' of Bench Press',
        checkLabel: (active ? 'Undo set ' : 'Mark set ') + s.n + ' of Bench Press',
        rowStyle: self.rowStyle(active),
        checkStyle: self.checkStyle(active),
        checkColor: active ? '#0A0C0E' : '#565C63',
        toggle: function () {
          var next = {};
          for (var k in self.state.done) { next[k] = self.state.done[k]; }
          next[s.n] = !active;
          self.setState({ done: next, restOpen: !active ? true : self.state.restOpen });
        }
      };
    });

    var opts = [30, 60, 90, 120, 0];
    var restPills = opts.map(function (v) {
      var sel = self.state.rest === v;
      var label = v === 0 ? 'Custom' : (v >= 60 ? (v / 60) + ' min' : v + 's');
      return {
        label: label,
        style: 'height:38px;padding:0 15px;border-radius:19px;border:1px solid ' +
          (sel ? '#FF5A3C' : '#2E343A') + ';background:' +
          (sel ? 'rgba(255,90,60,0.14)' : '#1C2024') + ';color:' +
          (sel ? '#FF8F79' : '#C7CCD1') + ";font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600",
        pick: function () { self.setState({ rest: v }); }
      };
    });

    return {
      setsA: setsA,
      restPills: restPills,
      restOpen: this.state.restOpen,
      closeRest: function () { self.setState({ restOpen: false }); }
    };
  }
}
</script>
</body>
</html>
